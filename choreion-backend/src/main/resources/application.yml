# application.yml
spring:
  application:
    name: choreography-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/choreion
    username: postgres
    password: trekkete
    driver-class-name: org.postgresql.Driver
  
  jpa:
    init:
      mode: always  # or 'never' after first run
      platform: postgresql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

app:
  jwt:
    secret: c6f9f65cf085931f4b67ced8c31d53a25a45598194d76ef0779edaa564671a7c
    expiration: 86400000
