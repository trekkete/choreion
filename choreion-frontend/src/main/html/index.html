<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choreion</title>
    <script src="https://unpkg.com/konva@10/konva.min.js"></script>
    <script src="https://unpkg.com/@panzoom/panzoom@4.6.0/dist/panzoom.min.js"></script>
    <script type="module" src="../js/main.js"></script>
    <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1>Choreion</h1>
        <div class="header-controls">
            <button id="toggleMode">Switch to Playback Mode</button>
            <button id="resetPositions">Reset Positions</button>
            <button class="btn-danger" id="clearAll">Clear Routes</button>
        </div>
    </div>

    <div class="main-content">
        <div class="canvas-section">
            <div class="canvas-controls">
                <div class="mode-info" id="modeInfo">
                    <strong>Design Mode:</strong> Select a person from the sidebar and click on the grid to create their route.
                </div>

                <div id="playbackControls" style="display: none;">
                    <div class="playback-controls">
                        <div class="control-group">
                            <button id="playPause">▶ Play</button>
                            <button id="stop">⏹ Stop</button>
                        </div>
                        <div class="control-group">
                            <label>Speed:</label>
                            <input type="range" id="speed" min="0.5" max="3" step="0.1" value="1">
                            <span id="speedValue">1.0x</span>
                        </div>
                        <div class="control-group">
                            <label>Time:</label>
                            <span id="timeDisplay">0.0s</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="canvas-wrapper">
                <div id="container"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="tabs">
                <button class="tab active" data-tab="choreographies">Choreographies</button>
                <button class="tab" data-tab="people">People</button>
            </div>

            <div id="choreographiesTab" class="tab-content active">
                <div class="section-title">Choreographies</div>

                <div class="form-group">
                    <input type="text" id="choreographyName" placeholder="Choreography name...">
                </div>

                <div class="form-row">
                    <button class="btn-success" id="saveChoreography" style="flex: 1;">💾 Save</button>
                    <button class="btn-danger btn-small" id="deleteChoreography">🗑️</button>
                </div>

                <div id="statusMessage" class="status"></div>

                <div class="section-title" style="margin-top: 20px;">Saved Choreographies</div>
                <div id="choreographyList" class="choreography-list">
                    <div class="empty-state">
                        <div class="empty-state-icon">🎭</div>
                        <div>No choreographies yet</div>
                        <div style="font-size: 12px;">Create one by designing routes and clicking Save</div>
                    </div>
                </div>
            </div>

            <div id="peopleTab" class="tab-content">
                <div class="section-title">Add New Person</div>

                <div class="add-person-form">
                    <div class="form-group">
                        <label>Name:</label>
                        <input type="text" id="newPersonName" placeholder="Person name...">
                    </div>
                    <div class="form-group">
                        <label>Letter:</label>
                        <input type="text" id="newPersonLetter" placeholder="Person letter...">
                    </div>
                    <div class="form-group">
                        <label>Color:</label>
                        <input type="color" id="newPersonColor" value="#3498db">
                    </div>
                    <button class="btn-success" id="addPerson" style="width: 100%;">➕ Add Person</button>
                </div>

                <div class="section-title">People (Click to design route)</div>
                <div id="personList" class="person-list"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
